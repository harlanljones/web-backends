# PostgreSQL configuration for the benchmark database node.
#
# Sized for the specification in docs/benchmark/testbed-hardware.md: 16 GB
# given to the container, 8 dedicated cores, NVMe storage. Rationale for every
# non-default value is in docs/benchmark/database.md; the short version is
# inline here.

listen_addresses = '*'
port = 5432

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
# Eight framework candidates with a 32-connection pool each, plus the exporter
# and an operator psql. Only one framework runs at a time, so 200 is generous;
# the headroom exists so a pool-leak bug in one candidate surfaces as a slow
# connection rather than as a hard refusal that aborts the trial.
max_connections = 200
superuser_reserved_connections = 5

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# 25% of the container's 16 GB, the standard starting point.
shared_buffers = 4GB

# Deliberately honest rather than optimistic: tells the planner roughly how
# much of the seed data the OS is likely caching. The seed set is ~1 GB, so
# every read-workload query should plan as if it is cached, which is the
# steady-state condition the benchmark measures.
effective_cache_size = 12GB

# Per-sort/hash allocation. The benchmark's queries are point lookups and small
# joins, so this is not a throughput lever; it is set modestly so a bad plan
# cannot consume the whole container.
work_mem = 16MB
maintenance_work_mem = 1GB

# ---------------------------------------------------------------------------
# Write-ahead log
# ---------------------------------------------------------------------------
# The transactional write workload is the one place WAL settings dominate
# results, so these are set to production-realistic durability, NOT to the
# fastest possible configuration. synchronous_commit stays on: turning it off
# would make every framework look faster while measuring nothing about the
# framework.
wal_level = replica
synchronous_commit = on
wal_compression = lz4

# Large WAL between checkpoints so a ten-minute write trial does not contain a
# checkpoint storm that lands in one candidate's run and not another's.
min_wal_size = 2GB
max_wal_size = 16GB
checkpoint_timeout = 30min
# Spread checkpoint I/O over most of the interval to keep it out of p99.9.
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------------
# Planner and storage
# ---------------------------------------------------------------------------
# NVMe: random access costs nearly the same as sequential, so the default 4.0
# would wrongly steer point lookups toward sequential scans.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------------------------
# Parallelism
# ---------------------------------------------------------------------------
# Parallel workers are disabled for the benchmark. With thousands of concurrent
# short queries, per-query parallelism adds worker-startup variance to tail
# latency and can let the database consume more than its allotted cores, which
# would attribute database capacity to the framework.
max_parallel_workers_per_gather = 0
max_parallel_workers = 0
max_parallel_maintenance_workers = 2
max_worker_processes = 8

# ---------------------------------------------------------------------------
# Autovacuum
# ---------------------------------------------------------------------------
# The write workload creates a lot of dead tuples in ten minutes. Autovacuum
# stays enabled -- disabling it would be unrealistic and would degrade later
# trials -- but it is made more aggressive and given I/O headroom so it keeps
# up steadily instead of arriving as one large pause inside a trial.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 2000

# ---------------------------------------------------------------------------
# Statistics
# ---------------------------------------------------------------------------
# pg_stat_statements is how a trial's SQL is attributed back to an endpoint,
# and how "did this framework's ORM emit the query we intended?" is answered.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off
track_io_timing = on
track_functions = none

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Log volume is a measured cost. Statement logging is off; only genuinely slow
# statements, waits, and errors are recorded.
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_statement = 'none'
log_duration = off
# 100 ms is far above any intended query in this benchmark, so anything logged
# here is a finding.
log_min_duration_statement = 100ms
log_lock_waits = on
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d '

# ---------------------------------------------------------------------------
# Timeouts
# ---------------------------------------------------------------------------
# A stuck statement must not hold a connection for the whole trial.
statement_timeout = 30s
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s

# ---------------------------------------------------------------------------
# Locale and time
# ---------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
