# Tell Grafana where to look for dashboards. The actual dashboard JSON lives
# in /var/lib/grafana/dashboards, which is bind-mounted from
# infra/observability/grafana/dashboards in docker-compose.yml.

apiVersion: 1

providers:
  - name: bench
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
