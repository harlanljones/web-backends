# Recording rules for the benchmark.
#
# These are deliberately sparse. The framework is the unit under test; every
# rule here is either a non-framework signal (host load, database lag) or an
# aggregation that the k6 client and framework /metrics endpoint do not
# already produce.
#
# Run the test with: promtool check rules /etc/prometheus/rules/*.yml

groups:
  - name: bench.host
    interval: 5s
    rules:
      - record: bench:host:cpu_utilization:rate5s
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5s]))

      - record: bench:host:memory_used_bytes
        expr: node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes

      # 99th percentile of steal time over the last five samples. Non-zero
      # means the host is not exclusively ours; the run manifest flags any
      # trial whose max exceeds 0.5% as not publishable.
      - record: bench:host:cpu_stealtime_p99:rate5s
        expr: |
          quantile_over_time(0.99,
            rate(node_cpu_seconds_total{mode="steal"}[5s])[1m:5s]
          )

      - record: bench:host:psi_cpu_some_p99
        expr: |
          quantile_over_time(0.99,
            node_pressure_cpu_waiting_seconds_total[1m:5s]
          )

  - name: bench.database
    interval: 5s
    rules:
      # Active connections, summed across all application containers. The
      # configured pool size is the upper bound; if the recorded value
      # exceeds it, a framework has opened its own pool and the trial is
      # discarded.
      - record: bench:db:active_connections
        expr: pg_stat_activity_count{state="active"}

      # Database write throughput, the transactional workload's signal.
      - record: bench:db:tps:rate1m
        expr: |
          sum(rate(pg_stat_database_tup_inserted{datname=~"bench"}[1m]))
          + sum(rate(pg_stat_database_tup_updated{datname=~"bench"}[1m]))

  - name: bench.app
    interval: 5s
    rules:
      # End-to-end p99, computed from the framework's histogram. The framework
      # is responsible for the histogram name; the recording rule normalizes
      # across candidates.
      - record: bench:app:http_request_duration:p99:rate1m
        expr: |
          histogram_quantile(0.99,
            sum by (le) (
              rate(http_request_duration_seconds_bucket[1m])
            )
          )
