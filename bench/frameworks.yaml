# Framework registry.
#
# The trial driver reads this file to know what to run. The shape is a
# YAML document, one entry per framework, with the build target, the
# start command, and the env-file contract.
#
# Adding a new framework is a one-line addition here, plus the framework
# directory under apps/ that builds the listed image.

frameworks:
  - name: go
    image: bench/go:latest
    dockerfile: apps/go/Dockerfile
    # The contract is the same for every framework; the entrypoint is the
    # binary. Frameworks that need a shell wrapper can list it here.
    entrypoint: ["/usr/local/bin/bench-go"]
    # Per-framework extra env, layered on top of the trial's env. Most
    # frameworks will not need this; the file is here for the GoAMQP /
    # Spring-Boot-style "set this to enable that" cases.
    env: {}
    # Workloads this framework implements. The conformance runner uses
    # this to know which endpoints to test. "all" means every contract
    # endpoint. The list form lets an experimental framework opt into
    # only the read workload, say, without failing conformance for the
    # other three.
    workloads: all
  - name: rust
    image: bench/rust:latest
    dockerfile: apps/rust/Dockerfile
    entrypoint: ["/usr/local/bin/bench-axum"]
    env: {}
    workloads: all
  - name: node
    image: bench/node:latest
    dockerfile: apps/node/Dockerfile
    entrypoint: ["node", "src/index.js"]
    env: {}
    workloads: all
  - name: bun
    image: bench/bun:latest
    dockerfile: apps/bun/Dockerfile
    # The bun image uses a file-based ENTRYPOINT with CMD; the effective
    # command is `bun run src/index.ts`.
    entrypoint: ["bun", "run", "src/index.ts"]
    env: {}
    workloads: all
  - name: python
    image: bench/python:latest
    dockerfile: apps/python/Dockerfile
    entrypoint: ["/app/.venv/bin/python", "/app/main.py"]
    env: {}
    workloads: all
  - name: spring
    image: bench/spring:latest
    dockerfile: apps/spring/Dockerfile
    entrypoint: ["java", "-jar", "/app/app.jar"]
    env: {}
    workloads: all
  - name: aspnet
    image: bench/aspnet:latest
    dockerfile: apps/aspnet/Dockerfile
    entrypoint: ["dotnet", "/app/publish/Bench.dll"]
    env: {}
    workloads: all
  - name: phoenix
    image: bench/phoenix:latest
    dockerfile: apps/phoenix/Dockerfile
    entrypoint: ["/app/bench"]
    env: {}
    workloads: all
