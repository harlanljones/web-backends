spring.application.name=bench-spring

# The contract's PORT env var maps onto the servlet port. SPRING_SERVER_PORT
# would be the relaxed-binding name; here we read the harness's PORT directly
# and default to the contracted 8080.
server.port=${PORT:8080}

# Project Loom: Spring Boot 3.2+ swaps the servlet thread pool for virtual
# threads when this is set. Tomcat then runs each request on a carrier-free
# virtual thread, so the framework's concurrency is bounded by HikariCP's
# DB_POOL_SIZE (you cannot have more in-flight DB calls than connections),
# not by a fixed 200-worker platform thread pool.
spring.threads.virtual.enabled=true

# In addition to the exact Hikari pool bound in DatabaseConfig, cap Tomcat's
# accept count so it does not buffer unbounded backlog under ramp.
server.tomcat.threads.max=2048

# Records use camelCase fields; the contract is snake_case JSON.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# /health must not depend on the pool being ready to serve; the DataSource
# is constructed at startup, and the process only becomes reachable once it is.
spring.main.banner-mode=off
logging.level.root=${LOGGING_LEVEL_ROOT:warn}
