[package]
name = "bench-axum"
version = "0.1.0"
edition = "2021"
description = "Axum on Rust/Tokio reference implementation of the benchmark contract"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus = "0.13"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
# The benchmark measures the framework, not the optimizer. LTO + codegen
# units for a smaller, faster binary; panic = abort to drop the unwinder.
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
